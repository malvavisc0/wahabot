# Publish the wahabot image to GHCR.
#
# Triggered by pushing a version tag (e.g. `v0.1.0`); the tag must match
# the version in pyproject.toml. Publishes :<version> and :latest.
# Deployment is handled by Coolify: it pulls the image (usually :latest)
# and runs docker-compose.yml from this repo.
#
# Tag a release:
#   git tag v0.1.0 && git push origin v0.1.0
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version from pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # No provenance/SBOM attestations: they show up on the GHCR
          # package page as stray "unknown/unknown" artifacts.
          provenance: false
          sbom: false
          # Labels/annotations per the GHCR labelling guide
          # (org.opencontainers.image.*). The Dockerfile declares matching
          # ARGs; these build args populate the image labels at build time.
          # annotation-index.* surfaces the description on the multi-arch
          # manifest so it shows on the GHCR package page.
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.version }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_CREATED=${{ github.event.repository.updated_at }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=wahabot
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
            org.opencontainers.image.description=WhatsApp bot bridge on the WAHA HTTP API
          annotations: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=WhatsApp bot bridge on the WAHA HTTP API
          cache-from: type=gha
          cache-to: type=gha,mode=max
