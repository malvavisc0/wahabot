name: wahabot

services:
  wahabot:
    image: ghcr.io/malvavisc0/wahabot:latest
    restart: unless-stopped
    container_name: wahabot
    hostname: wahabot
    environment:
      # Required.
      WAHABOT_WEBHOOK_HMAC_KEY: ${WAHABOT_WEBHOOK_HMAC_KEY:?set WAHABOT_WEBHOOK_HMAC_KEY}
      WAHABOT_WAHA_URL: ${WAHABOT_WAHA_URL:?set WAHABOT_WAHA_URL}
      WAHABOT_WAHA_API_KEY: ${WAHABOT_WAHA_API_KEY:?set WAHABOT_WAHA_API_KEY}
      WAHABOT_LLM_API_BASE: ${WAHABOT_LLM_API_BASE:?set WAHABOT_LLM_API_BASE}
      WAHABOT_LLM_API_KEY: ${WAHABOT_LLM_API_KEY:?set WAHABOT_LLM_API_KEY}
      WAHABOT_LLM_MODEL: ${WAHABOT_LLM_MODEL:?set WAHABOT_LLM_MODEL}
      WAHABOT_VISION: ${WAHABOT_VISION:?set WAHABOT_VISION}
      # Voice-note transcription — empty URL disables the feature.
      WAHABOT_TRANSCRIBE_URL: ${WAHABOT_TRANSCRIBE_URL:-}
      WAHABOT_TRANSCRIBE_TIMEOUT: ${WAHABOT_TRANSCRIBE_TIMEOUT:-300}
      WAHABOT_MAX_AUDIO_BYTES: ${WAHABOT_MAX_AUDIO_BYTES:-26214400}
      WAHABOT_TRANSCRIBE_LANGUAGE: ${WAHABOT_TRANSCRIBE_LANGUAGE:-auto}
      # Video understanding — frames + WhisperX transcript (needs
      # vision-capable LLM; ffmpeg ships in the image).
      WAHABOT_VIDEO: ${WAHABOT_VIDEO:-true}
      WAHABOT_MAX_VIDEO_BYTES: ${WAHABOT_MAX_VIDEO_BYTES:-67108864}
      WAHABOT_VIDEO_FRAMES: ${WAHABOT_VIDEO_FRAMES:-6}
      WAHABOT_VISION_MAX_IMAGES: ${WAHABOT_VISION_MAX_IMAGES:-0}
      # Multi-message burst assembly — one agent turn per same-sender
      # burst (off keeps the pre-burst per-message behavior).
      WAHABOT_BURST_ENABLED: ${WAHABOT_BURST_ENABLED:-false}
      WAHABOT_BURST_INACTIVITY_S: ${WAHABOT_BURST_INACTIVITY_S:-8.0}
      WAHABOT_BURST_HOLD_CAP_S: ${WAHABOT_BURST_HOLD_CAP_S:-30.0}
      # Optional.
      WAHABOT_TIMEZONE: ${WAHABOT_TIMEZONE:-UTC}
      WAHABOT_LOG_LEVEL: ${WAHABOT_LOG_LEVEL:-INFO}
      WAHABOT_MAX_IMAGE_BYTES: ${WAHABOT_MAX_IMAGE_BYTES:-10485760}
      WAHABOT_MAX_URL_IMAGES: ${WAHABOT_MAX_URL_IMAGES:-2}
      WAHABOT_MAX_FILE_BYTES: ${WAHABOT_MAX_FILE_BYTES:-16777216}
      WAHABOT_MAX_VIDEO_UPLOAD_BYTES: ${WAHABOT_MAX_VIDEO_UPLOAD_BYTES:-67108864}
      # Optional, advanced.
      WAHABOT_MEMORY_TOKEN_LIMIT: ${WAHABOT_MEMORY_TOKEN_LIMIT:-8000}
      WAHABOT_MEMORY_PERSIST: ${WAHABOT_MEMORY_PERSIST:-true}
      # Trimmed-turn memory layers: recap and per-chat thread recall.
      WAHABOT_LEARNED_MEMORY: ${WAHABOT_LEARNED_MEMORY:-true}
      WAHABOT_THREAD_RECALL: ${WAHABOT_THREAD_RECALL:-true}
      WAHABOT_EMBED_API_BASE: ${WAHABOT_EMBED_API_BASE:-}
      WAHABOT_EMBED_MODEL: ${WAHABOT_EMBED_MODEL:-embeddinggemma-2}
      WAHABOT_EMBED_TIMEOUT: ${WAHABOT_EMBED_TIMEOUT:-10}
      # Triage gate: d1-3B classifier for adversarial input,
      # escalation and unaddressed-group participation.
      WAHABOT_TRIAGE_GATE: ${WAHABOT_TRIAGE_GATE:-true}
      WAHABOT_GATE_API_BASE: ${WAHABOT_GATE_API_BASE:-http://omnitron.tago.lan:9194/v1}
      WAHABOT_GATE_MODEL: ${WAHABOT_GATE_MODEL:-d1-3B}
      WAHABOT_GATE_TIMEOUT: ${WAHABOT_GATE_TIMEOUT:-0.8}
      WAHABOT_GATE_API_KEY: ${WAHABOT_GATE_API_KEY:-}
      WAHABOT_TOOL_ROUND_LIMIT: ${WAHABOT_TOOL_ROUND_LIMIT:-50}
      WAHABOT_WEB_SEARCH_MAX_RESULTS: ${WAHABOT_WEB_SEARCH_MAX_RESULTS:-5}
      WAHABOT_WEB_SEARCH_TIMEOUT: ${WAHABOT_WEB_SEARCH_TIMEOUT:-30}
      WAHABOT_WEB_SEARCH_PROXY: ${WAHABOT_WEB_SEARCH_PROXY:-}
      WAHABOT_TELL_TIMEOUT: ${WAHABOT_TELL_TIMEOUT:-600}
      WAHABOT_RUN_TIMEOUT: ${WAHABOT_RUN_TIMEOUT:-120}
      # Per-request LLM timeout; must stay below WAHABOT_RUN_TIMEOUT so
      # a hung provider fails fast inside the run budget.
      WAHABOT_LLM_TIMEOUT: ${WAHABOT_LLM_TIMEOUT:-60}
      WAHABOT_LLM_REASONING_EFFORT: ${WAHABOT_LLM_REASONING_EFFORT:-}
      WAHABOT_LLM_AUTO_CACHE: ${WAHABOT_LLM_AUTO_CACHE:-true}
      WAHABOT_LLM_CONTEXT_WINDOW: ${WAHABOT_LLM_CONTEXT_WINDOW:-0}
      WAHABOT_SHELL_TOOL: ${WAHABOT_SHELL_TOOL:-false}
      WAHABOT_SHELL_TIMEOUT: ${WAHABOT_SHELL_TIMEOUT:-30}
      WAHABOT_SHELL_MAX_OUTPUT: ${WAHABOT_SHELL_MAX_OUTPUT:-2000}
      WAHABOT_SESSION: ${WAHABOT_SESSION:-default}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_TRACING_ENVIRONMENT: ${LANGFUSE_TRACING_ENVIRONMENT:-production}
      # Fixed by the container layout: bind and volume are always these.
      WAHABOT_HOST: 0.0.0.0
      WAHABOT_PORT: "8080"
      WAHABOT_DATA_DIR: /app/data
    ports:
      - "${WAHABOT_PORT:-8080}:8080"
    volumes:
      # Bind-mounted so session configs and the event journal are plain
      # files on the host — edit them directly, no docker cp needed.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
