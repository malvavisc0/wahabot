[project]
name = "wahabot"
version = "0.2.9"
description = "A WhatsApp bot that answers chats with an LLM agent"
readme = "README.md"
authors = [
    { name = "Malvavisc0", email = "207609879+malvavisc0@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "llama-index-core",
    "llama-index-llms-openai-like",
    "loguru",
    "pydantic-settings",
    "typer",
    "uvicorn[standard]",
    "curl-cffi",
    "pillow",
    "webserp",
    "yfinance",
    "youtube-transcript-api",
    # LLM observability (Langfuse); observability.py degrades to a no-op
    # without credentials, and these stay dormant unless enabled.
    "langfuse",
    "opentelemetry-instrumentation-llamaindex",
]

[project.scripts]
wahabot = "wahabot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wahabot"
module-root = "src"

[dependency-groups]
dev = [
    "basedpyright",
    "radon",
    "ruff",
]

[tool.basedpyright]
reportCallInDefaultInitializer = false
reportUnusedCallResult = false
reportExplicitAny = false
reportAny = false
reportUnannotatedClassAttribute = false
reportImportCycles = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportDeprecated = false
reportUnusedFunction = false
reportUnusedImport = false
reportCallIssue = false

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 90

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

